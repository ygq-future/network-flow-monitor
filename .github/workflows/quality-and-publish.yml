name: Quality & Publish

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish GitHub Release if quality gate passes'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  quality:
    name: Quality Gate & Portable Package (Windows x64)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      archive_name: ${{ steps.meta.outputs.archive_name }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Extract and verify project version
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cmakeContent = Get-Content -LiteralPath 'CMakeLists.txt' -Raw
          if ($cmakeContent -notmatch 'project\s*\(\s*NetworkFlowMonitor[\s\S]*?\bVERSION\s+(\d+\.\d+\.\d+)\b') {
            throw 'Failed to parse project VERSION from CMakeLists.txt'
          }
          $version = $matches[1]

          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($tagVersion -ne $version) {
              throw "Git tag ($env:GITHUB_REF_NAME) does not match project version (v$version)"
            }
          }

          $archiveName = "NetworkFlowMonitor-$version-win-x64.zip"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "archive_name=$archiveName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Verified version: v$version ($archiveName)"

      - name: Run Full Quality Gate
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tools/quality.ps1 -Mode Full -Clean

      - name: Build & Verify Release Portable ZIP
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = powershell -ExecutionPolicy Bypass -File tools/package.ps1 -Configuration Release
          $out | Out-Host
          $archivePath = Join-Path 'dist' "${{ steps.meta.outputs.archive_name }}"
          if (-not (Test-Path -LiteralPath $archivePath)) {
            throw "Expected portable archive not found at $archivePath"
          }
          $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash
          $shaFile = "$archivePath.sha256"
          "$hash  ${{ steps.meta.outputs.archive_name }}" | Set-Content -LiteralPath $shaFile -Encoding ascii
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload Portable Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetworkFlowMonitor-${{ steps.meta.outputs.version }}-win-x64
          path: |
            dist/${{ steps.meta.outputs.archive_name }}
            dist/${{ steps.meta.outputs.archive_name }}.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: quality
    runs-on: windows-latest
    if: >-
      needs.quality.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish_release == true))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Portable Package Artifact
        uses: actions/download-artifact@v4
        with:
          name: NetworkFlowMonitor-${{ needs.quality.outputs.version }}-win-x64
          path: dist

      - name: Resolve Release Note
        id: note
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.quality.outputs.version }}'
          $notePath = ".github/release-note/v$version.md"
          if (-not (Test-Path -LiteralPath $notePath)) {
            throw "Release note file not found: $notePath"
          }
          "note_path=$notePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.quality.outputs.version }}'
          $tag = "v$version"
          $title = "Network Flow Monitor v$version"
          $notePath = '${{ steps.note.outputs.note_path }}'
          $zipPath = "dist/${{ needs.quality.outputs.archive_name }}"
          $shaPath = "dist/${{ needs.quality.outputs.archive_name }}.sha256"

          & gh release view $tag > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $tag $zipPath $shaPath --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload release assets to $tag" }
            & gh release edit $tag --title $title --notes-file $notePath
            if ($LASTEXITCODE -ne 0) { throw "Failed to update release notes for $tag" }
          } else {
            & gh release create $tag $zipPath $shaPath --title $title --notes-file $notePath --target ${{ github.sha }}
            if ($LASTEXITCODE -ne 0) { throw "Failed to create release $tag" }
          }
